<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Multiples in Circles — ax + b</title>
</head>
<body>
  <main id="app">
    <h1>Multiples in Circles</h1>
    <section class="controls" aria-label="Circle controls">
      <label>Max N <input id="max-n" type="text" value="24" inputmode="numeric"></label>
      <div class="n-control">
        <label class="slider-label">N <input id="n-slider" type="range" min="1" max="24" value="12"></label>
        <output id="n-value">12</output>
        <button id="minus-button" class="small-button" type="button" aria-label="Decrease N">−</button>
        <button id="plus-button" class="small-button" type="button" aria-label="Increase N">+</button>
      </div>
      <label>a <input id="a-value" type="text" value="2" inputmode="numeric"></label>
      <label>b <input id="b-value" type="text" value="1" inputmode="numeric"></label>
      <button id="traverse-button" type="button">Traverse</button>
    </section>
    <p class="hint">Press Enter or tap Next step to reveal each segment and move to the next x.</p>
    <section id="canvas-container" class="canvas-container">
      <canvas id="circle-canvas" aria-label="Multiples in circles visualization"></canvas>
      <span id="point-popup" class="point-popup" hidden></span>
    </section>
    <button id="next-button" class="next-button" type="button" hidden>Next step</button>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
